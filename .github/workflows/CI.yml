name: CI

on: [push, pull_request]

# Cancel the current workflow if a newer commit gets pushed to the
# branch or PR that triggered it.
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:

  windows_msvc:
    continue-on-error: true
    strategy:
      matrix:
        image: [windows-2025-vs2026, windows-11-vs2026-arm]
    runs-on: ${{ matrix.image }}
    steps:
    - uses: actions/checkout@v7
    - uses: ilammy/msvc-dev-cmd@v1
    - run: |
        mkdir build
        cd build
        cl /nologo /TC /P /EP  /showIncludes /I"..\src\..\include" /Fi"asm.S" "..\src\fastcontext\asm.S" || exit /b
        type asm.S
        if "%PROCESSOR_ARCHITECTURE%"=="AMD64" set "BUILD_ARCH=x64"
        if "%PROCESSOR_ARCHITECTURE%"=="ARM64" set "BUILD_ARCH=ARM64"
        cmake -G "Visual Studio 18 2026" -A %BUILD_ARCH% -DQTHREADS_MINIMUM_PORTABLE=ON .. || exit /b
        cmake --build . --verbose --config Release --parallel 2
        dir src
        dir src\qthread.dir
        dir src\qthread.dir\Release
        dumpbin /symbols src\qthread.dir\Release\asm.obj
        ctest -C Release --output-on-failure || exit /b
      shell: cmd

  windows_clang_cl:
    continue-on-error: true
    strategy:
      matrix:
        image: [windows-2025-vs2026, windows-11-vs2026-arm]
    runs-on: ${{ matrix.image }}
    steps:
    - uses: actions/checkout@v7
    - uses: ilammy/msvc-dev-cmd@v1
    - run: |
        mkdir build
        cd build
        clang-cl /nologo /TC /P /EP /showIncludes /I"..\src\..\include" /Fi"asm.S" "..\src\fastcontext\asm.S" || exit /b
        type asm.S
        if "%PROCESSOR_ARCHITECTURE%"=="AMD64" set "BUILD_ARCH=x64"
        if "%PROCESSOR_ARCHITECTURE%"=="ARM64" set "BUILD_ARCH=ARM64"
        cmake -G "Visual Studio 18 2026" -T ClangCL -A %BUILD_ARCH% -DQTHREADS_MINIMUM_PORTABLE=ON .. || exit /b
        cmake --build . --verbose --config Release --parallel 2
        dir src
        dir src\qthread.dir
        dir src\qthread.dir\Release
        dumpbin /symbols src\qthread.dir\Release\asm.obj
        ctest -C Release --output-on-failure || exit /b
      shell: cmd

  windows_gcc:
    continue-on-error: true
    strategy:
      matrix:
        image: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.image }}
    steps:
    - uses: actions/checkout@v7
    - run: |
        mkdir build
        cd build
        cmake -G "MinGW Makefiles" -DQTHREADS_MINIMUM_PORTABLE=ON ..
        mingw32-make -j2
        mingw32-make test
      shell: bash

  windows_clang_gnu_abi:
    continue-on-error: true
    strategy:
      matrix:
        image: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.image }}
    steps:
    - uses: actions/checkout@v7
    - run: |
        mkdir build
        cd build
        cmake -G "MinGW Makefiles" -DQTHREADS_MINIMUM_PORTABLE=ON -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_FLAGS="--target=x86_64-w64-windows-gnu" -DCMAKE_CXX_FLAGS="--target=x86_64-w64-windows-gnu" -DCMAKE_ASM_FLAGS="--target=x86_64-w64-windows-gnu" ..
        mingw32-make -j2
        mingw32-make test
      shell: bash

